[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onecare-loop"
version = "2.0.0"
description = "A verifiable referral-closure platform for hypertension care pathways."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic[email]>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=43.0,<48.0",
  "itsdangerous>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0", "httpx2>=2.16,<3.0", "ruff>=0.6,<1.0", "playwright>=1.46,<2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/assets/*.svg", "web/assets/css/*.css", "web/assets/js/*.js"]
