services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onecare
      POSTGRES_USER: onecare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - onecare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecare -d onecare"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://onecare:${POSTGRES_PASSWORD}@db:5432/onecare
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_ADMIN: "false"
      CORS_ORIGINS: "[]"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  onecare-postgres:
